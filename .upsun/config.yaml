applications:
  graphile:
    source:
      root: "/"
      operations:
        check-runtime:
          command: |
            set -e
            wget -qO scripts/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            chmod +x scripts/yq
            export PATH="$(pwd)/scripts/":$PATH
            bash scripts/check-runtime.sh
    crons:
      check-runtime:
        # Run the code below every day at midnight.
        spec: '0 0 * * *'
        commands:
          start: |
            upsun source-operation:run check-runtime --no-wait --yes

    type: nodejs:20
    hooks:
      build: |
        set -e
        wget -qO ${PLATFORM_APP_DIR}/.global/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
        chmod +x "${PLATFORM_APP_DIR}/.global/bin/yq";
    web:
      commands:
        start: "node_modules/.bin/postgraphile"
    mounts:
      "/run": "shared:files/run"
      "/.cache": "shared:files/.cache"
    relationships:
      pg: "postgres:postgresql"

services:
  postgres:
    type: postgresql:16
    configuration:
      extensions:
        - uuid-ossp

routes:
  https://{default}/:
    type: upstream
    upstream: "graphile:http"
